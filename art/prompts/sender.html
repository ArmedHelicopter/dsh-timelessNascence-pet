<!doctype html>
<meta charset="utf-8">
<title>sender</title>
<script>
(async () => {
  const names = (new URLSearchParams(location.search).get('f') || 'refboard.jpg').split(',');
  const files = [];
  for (const n of names) {
    const buf = await (await fetch(n)).arrayBuffer();
    files.push({ name: n.split('/').pop(), buf });
  }
  window.opener.postMessage({ kind: 'refs', files }, '*');
  document.title = 'sent ' + names.length;
  setTimeout(() => window.close(), 500);
})();
</script>
